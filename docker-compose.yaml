services:

  backend:
    build:
      context: .
      dockerfile: app/Dockerfile

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped